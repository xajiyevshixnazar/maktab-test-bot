databases:
  - name: maktab-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: maktab-test-bot
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: maktab-db
          property: connectionString
      - key: PORT
        value: 10000
